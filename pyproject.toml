[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-style-clustering"
version = "0.1.0"
description = "F1 Driver Driving Style Classification using Telemetry Clustering (Master Thesis)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicolás Palavecino" }
]
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]
dashboard = [
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
