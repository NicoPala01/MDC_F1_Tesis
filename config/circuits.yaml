# Circuit corner typology and ZOI windows.

corner_speed_classification:
  slow:
    description: "Low-speed corners, chicanes, and tight hairpins"
    speed_threshold_max_kmh: 125
  medium:
    description: "Medium-speed technical corners"
    speed_threshold_min_kmh: 125
    speed_threshold_max_kmh: 205
  fast:
    description: "High-speed sweepers and high lateral-G sections"
    speed_threshold_min_kmh: 205

# Map circuit-specific YAML typology strings → slow|medium|fast buckets.
typology_buckets:
  heavy_braking_chicane: slow
  medium_chicane: medium
  medium_speed: medium
  high_speed_chicane: fast
  long_medium_fast_entry: medium
  slow_technical: slow
  ultra_high_speed: fast
  high_speed_s_curves: fast
  fast_entry_heavy_braking: medium
  hard_braking_medium_slow: slow
  extreme_slow_hairpin: slow
  downhill_braking_chicane: slow
  fast_chicane: fast

default_zoi_offsets:
  # Distance offsets (in meters) relative to corner apex distance from FastF1 circuit_info.
  # Disjoint windows: braking | apex | exit, with track wrap-around.
  braking:
    pre_apex_meters: 350
    post_apex_meters: 0
  apex:
    pre_apex_meters: 60
    post_apex_meters: 60
  exit:
    pre_apex_meters: 0
    post_apex_meters: 250

# Benchmark events use ONLY these key_corners groups as ZOIs
# (one zone per entry, not one per FastF1 Number).
# Monza cubre las 11 curvas FastF1. Las chicanas siguen agrupadas en una zona por maniobra.
# Unmatched circuits use the speed-threshold fallback in extract_circuit_zones.
