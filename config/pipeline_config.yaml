# F1 driving-style clustering

general:
  season: 2025
  default_session_type: "R"
  cache_dir: "cache"
  enable_fastf1_cache: true
  random_state: 42
  min_races_season: 8

# Solo la temporada. Una columna entra si se puede medir igual en todas las
# carreras. fast__brake_point_rel no se mide en la tipología fast de varios
# circuitos con fallback, y dropna(how="any") se lleva la vuelta. Una carrera
# suelta no lee esta lista: el default de Monza conserva la columna.
season:
  exclude_columns:
    - fast__brake_point_rel

data_filtering:
  require_accurate_laps: true
  exclude_box_laps: true
  exclude_deleted_laps: true
  green_flag_only: true
  push_mode: false
  use_quicklaps_only: false
  exclude_pit_in_out: true
  exclude_safety_car: true
  exclude_yellow_flags: true
  min_valid_laps_per_driver: 3

features:
  metrics:
    - brake_point_rel
    - trail_brake_frac
    - apex_speed_rel
    - throttle_attack
    - coast_frac
    - full_throttle_frac
    - throttle_onset_rel
  include_throttle_onset: false
  include_brake_point_iqr: true
  standardization: "robust"
  # First stage. lap_synchronous below adds the same-lap field median on top.
  normalization_unit: "typology_session_median"
  aggregation: "median"
  # Off on the clustered matrix. Team/compound/tyre-life controls do not hold:
  # the team cut counts laps, the regression is not a joint fixed effect, and an
  # additive dummy misses that a later brake is easier on soft and moves with wear.
  # The typology×session median above stays; that is the style vector.
  residualize_team_tyre: false
  # Subtract the field median of the same lap (fuel burn, track evolution). With
  # only the session median, Monza 2025 classes split early vs late laps
  # (docs/metricas_telemetria.md).
  lap_synchronous: true
  # After lap-synchronous centring: remove Compound / TyreLife slopes estimated
  # within driver (driver and team levels are kept).
  within_driver_tyre_effects: true
  # Time-domain throttle and lift metrics per zone (EXTENDED_STYLE_FEATURES).
  # Reported per lap and per driver; not part of the clustered matrix.
  extended_metrics: false
  # Clustered columns: drop the ones that are zero on >90% of laps and keep
  # those whose ICC(1) by driver is at least min_icc (null = keep all).
  feature_screening:
    drop_near_constant: false
    min_icc: null
  # typology: one block per slow/medium/fast. zone: one block per corner.
  # zone is off. Brake columns that are missing on too many laps are left out
  # of that vector so dropna(how="any") does not discard the lap.
  vector_unit: typology
  zone_brake_min_coverage: 0.95
  # Off. Multiplies each zone's pre-apex braking metres by (entry speed / ref)^2.
  # The trial runs only on speed-threshold fallback races, never on Monza.
  speed_scaled_windows: false
  speed_scaled_ref_kmh: 300
  # Off. On the matrix that enters the scaler, drop a lap when any style column
  # with IQR > 0 has |value - median| / IQR > 10. The same 10 is used on every
  # race. IQR 0 flags nobody. A single race and the season default leave this off.
  column_outlier_trim: false

dimensionality_reduction:
  pca:
    use_as_clustering_input: auto
    n_components: null
    variance_threshold: 0.85

clustering:
  use_rule_based_k: true
  default_k: null
  min_cluster_size: 3
  silhouette_threshold: 0.25
  dbscan_prefilter: false
  seed_stability_n: 10
  driver_bootstrap: true
  driver_bootstrap_n: null
  driver_bootstrap_method: bootstrap
  compare_aggregators: true
  kmeans:
    k_range: [2, 7]
    init: "k-means++"
    n_init: 20
  evaluation_metrics:
    - silhouette_score
    - davies_bouldin
    - calinski_harabasz
